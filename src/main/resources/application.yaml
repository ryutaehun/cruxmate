spring:
  config:
    import: "optional:file:./.env[.properties]"

  application:
    name: cruxmate

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cruxmate?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration


jwt:
  issuer: ${JWT_ISSUER:https://cruxmate.local}
  secret: ${JWT_SECRET}
  access-token-expiration: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
