<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | CruxMate</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="centered-page">
    <section class="panel auth-panel">
        <div>
            <p class="eyebrow">CRUXMATE</p>
            <h1>다음 크럭스를<br>예약하세요.</h1>
            <p class="muted">안전한 동시 예약과 중복 요청 방지를 직접 확인할 수 있는 데모입니다.</p>
        </div>

        <form id="login-form" class="form-stack">
            <div class="field">
                <label for="email">이메일</label>
                <input id="email" name="email" type="email" autocomplete="email"
                       placeholder="climber@example.com" required>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" autocomplete="current-password"
                       placeholder="비밀번호 입력" required>
            </div>
            <p id="login-message" class="message" role="alert" hidden></p>
            <button id="login-button" class="button button-primary button-full" type="submit">로그인</button>
        </form>
    </section>
</main>
<script type="module" src="/js/login.js"></script>
</body>
</html>
